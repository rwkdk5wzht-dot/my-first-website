<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14243b">
  <title>项目工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top"><div class="wrap top-inner">
    <div class="brand"><span class="brand-icon" aria-hidden="true">▦</span><span data-i="brand">项目工作台</span></div>
    <div class="languages" role="group" aria-label="语言 / 言語"><button type="button" data-lang="zh" lang="zh-CN">中文</button><button type="button" data-lang="ja" lang="ja">日本語</button></div>
  </div></header>
  <main class="wrap">
    <div class="intro"><div><h1 data-i="heading">项目总览</h1><p data-i="subtitle">在一个工作台跟进个人项目、待办和风险。</p></div><button class="primary" id="add" data-i="add">＋ 新增项目</button></div>
    <div id="stats" class="stats"></div>
    <nav class="modules" aria-label="模块 / モジュール">
      <button data-view="projects" data-i="projects">项目进度</button>
      <button data-view="tasks" data-i="tasks">待办事项</button>
      <button data-view="risks" data-i="risks">风险管理</button>
      <button data-view="updates" data-i="updates">更新记录</button>
    </nav>
    <section class="panel" aria-labelledby="section-title">
      <div class="section-head"><h2 id="section-title"></h2><span id="count" aria-live="polite"></span></div>
      <div class="filters">
        <label><span data-i="search">关键词搜索</span><input id="search" type="search"></label>
        <label><span data-i="status">状态</span><select id="status"></select></label>
        <label><span data-i="priority">优先级</span><select id="priority"></select></label>
      </div>
      <div id="results"></div>
    </section>
    <p id="notice" role="status"></p>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="project-form">
      <h2 id="editor-title"></h2>
      <label><span data-i="name">项目名称</span><input name="name" required maxlength="100"></label>
      <label><span data-i="description">项目说明</span><textarea name="description" maxlength="500" rows="2"></textarea></label>
      <div class="form-grid">
        <label><span data-i="status">状态</span><select name="status"></select></label>
        <label><span data-i="priority">优先级</span><select name="priority"></select></label>
        <label><span data-i="progress">进度 (%)</span><input name="progress" type="number" min="0" max="100" required></label>
        <label><span data-i="due">截止日期</span><input name="due" type="date"></label>
      </div>
      <label><span data-i="taskInput">待办（每行一项）</span><textarea name="tasks" rows="2" maxlength="1500"></textarea></label>
      <label><span data-i="riskInput">风险（每行一项）</span><textarea name="risks" rows="2" maxlength="1500"></textarea></label>
      <div class="actions"><button type="button" data-close data-i="cancel">取消</button><button class="primary" data-i="save">保存项目</button></div>
    </form>
  </dialog>
  <dialog id="remove" aria-labelledby="remove-title">
    <h2 id="remove-title" data-i="delete">删除项目</h2><p id="remove-message"></p>
    <div class="actions"><button data-close data-i="cancel">取消</button><button id="confirm-remove" class="danger" data-i="delete">删除项目</button></div>
  </dialog>
  <noscript>请启用 JavaScript。JavaScript を有効にしてください。</noscript>
</body>
</html>
